---
# Roles are listed here, not as meta dependencies, so the order is visible
# in one place: common first on every host, then the host's own role.
- name: Configure fw-ips
  hosts: fw_ips
  become: true
  roles:
    - common
    - fw_ips

# Private hosts reach SSM only through fw-ips's NAT, which the play above
# configures, so this play runs after it and first waits for the agent to
# register (decision 50). Facts are gathered once the host answers.
- name: Configure db
  hosts: db
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait until db is reachable through SSM
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - common
    - db

# Same pattern as db (decision 50).
- name: Configure app
  hosts: app
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait until app is reachable through SSM
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - common
    - app

# Same pattern as db (decision 50).
- name: Configure proxy
  hosts: proxy
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait until proxy is reachable through SSM
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - common
    - proxy

# Same pattern as db (decision 50). siem's role installs Wazuh (task 1.16).
- name: Configure siem
  hosts: siem
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait until siem is reachable through SSM
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - common
    - siem

# Same pattern as db (decision 50). mon's role installs Prometheus, Grafana
# and Alertmanager (task 1.22).
- name: Configure mon
  hosts: mon
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait until mon is reachable through SSM
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - common
    - mon

# node_exporter on every host, after each host's own play (task 1.23).
- name: Install node_exporter
  hosts: all
  become: true
  roles:
    - node_exporter

# Wazuh agents last: they enroll with siem's manager when they start, so
# every host's own play and siem's play come first (decision 101).
- name: Install the Wazuh agents
  hosts: fw_ips:db:app:proxy:mon
  become: true
  roles:
    - wazuh_agent
