---
# mon (task 1.22, decisions 108 to 119). Runs after the common role, which
# provides apt over HTTPS and the AWS CLI. Order: the data volume, then
# Prometheus, which keeps its database on it. Alertmanager (PR 2c) next,
# and Grafana (PR 2b), which reads Prometheus, last.
- name: Mount the data volume
  ansible.builtin.import_tasks: volume.yml

- name: Install and configure Prometheus
  ansible.builtin.import_tasks: prometheus.yml

- name: Install and configure Alertmanager
  ansible.builtin.import_tasks: alertmanager.yml

- name: Install and configure blackbox_exporter
  ansible.builtin.import_tasks: blackbox.yml

- name: Install and configure YACE
  ansible.builtin.import_tasks: yace.yml

- name: Install and configure Grafana
  ansible.builtin.import_tasks: grafana.yml
