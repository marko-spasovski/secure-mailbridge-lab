---
- name: Reload Prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: reloaded

- name: Restart Prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: restarted
    daemon_reload: true

- name: Restart Grafana
  ansible.builtin.systemd_service:
    name: grafana-server
    state: restarted

- name: Reload Alertmanager
  ansible.builtin.systemd_service:
    name: alertmanager
    state: reloaded

- name: Restart Alertmanager
  ansible.builtin.systemd_service:
    name: alertmanager
    state: restarted
    daemon_reload: true

- name: Reload blackbox_exporter
  ansible.builtin.systemd_service:
    name: blackbox_exporter
    state: reloaded

- name: Restart blackbox_exporter
  ansible.builtin.systemd_service:
    name: blackbox_exporter
    state: restarted
    daemon_reload: true

- name: Restart YACE
  ansible.builtin.systemd_service:
    name: yace
    state: restarted
    daemon_reload: true
