---
# mon: Prometheus, Grafana and Alertmanager (task 1.22, decisions 108 to 116).
mon_private_ip: 10.0.5.20

# Prometheus, the current LTS line (decision 116): 3.13 is supported until
# 2027-07-31. To update: download the new linux-amd64 archive on the laptop,
# check its SHA-256 against the release's sha256sums.txt and only then copy
# it here, in a PR. The release publishes no signature or attestation.
mon_prometheus_version: 3.13.5
mon_prometheus_sha256: 0388822ace519c5a3a8ef556a541ce1b536e21d872f82deded465bd27a5a0699

# Loopback only (decision 114): Grafana on this host is the only client, and
# Prometheus scrapes outbound.
mon_prometheus_listen: 127.0.0.1:9090

# The persistent data volume (decision 109), found by its Name tag from the
# laptop like siem's, and mounted where Prometheus keeps its database.
mon_data_volume_name: mailbridge-lab-prometheus-data
mon_data_label: prometheus-data
mon_prometheus_data_dir: /var/lib/prometheus

# Retention by size only, so history is kept across sessions until the
# budget is used (decision 109). 7 GB of the 10 GB volume leaves room for the
# write-ahead log, which the size limit doesn't count, and ext4's reserve.
mon_prometheus_retention_size: 7GB

# Grafana from its apt repository, pinned by version and held (decisions
# 108, 117). 13.2 is a patched minor line; .0 releases are avoided.
mon_grafana_version: 13.2.5

# Grafana's apt signing key, pinned by the SHA-256 of the armored file, like
# Wazuh's (decision 91). Fingerprint B53A E77B ADB6 30A6 8304 6005 963F A277
# 1045 8545, expires 2027-08-22. To update: download it on the laptop, check
#   gpg --show-keys --with-fingerprint gpg.key
# still shows that fingerprint, and only then copy its SHA-256 here, in a PR.
mon_grafana_gpg_sha256: 3d4029689bc7e4444ec00abafa07f21e9c812b41f1123ab5bbe6f8c3e3f7ff8c

# Grafana's own certificate, signed on the laptop by the Wazuh root CA
# (decision 113): SSM name under /mon/certs/ and the file it's written to.
mon_grafana_tls_dir: /etc/grafana/tls
mon_grafana_certs:
  - { param: grafana-cert, file: grafana.pem }
  - { param: grafana-key, file: grafana-key.pem }

# Alertmanager, which has no LTS line, pinned to the newest release
# (decisions 108, 116). Same update rule as Prometheus: check the archive's
# SHA-256 against the release's sha256sums.txt on the laptop, then a PR.
mon_alertmanager_version: 0.34.2
mon_alertmanager_archive: alertmanager-{{ mon_alertmanager_version }}.linux-amd64.tar.gz
mon_alertmanager_sha256: 17ee14acd0f6ba6e25a436ff223d9c17ddd5cf484f543ad12f0932eaa89ba186

# Loopback only (decision 114); its HA cluster port is switched off in the
# unit (decision 119). Silences and the notification log only, so the root
# disk is enough: they may be lost at teardown.
mon_alertmanager_listen: 127.0.0.1:9093
mon_alertmanager_data_dir: /var/lib/alertmanager

# Every host's node_exporter, scraped by its private address (task 1.23).
# The host label keeps graphs and alerts readable.
mon_node_targets:
  - { host: fw-ips, address: "10.0.1.10:9100" }
  - { host: proxy, address: "10.0.2.10:9100" }
  - { host: app, address: "10.0.3.10:9100" }
  - { host: db, address: "10.0.4.10:9100" }
  - { host: siem, address: "10.0.5.10:9100" }
  - { host: mon, address: "10.0.5.20:9100" }

# postgres_exporter on db (task 1.23, decision 124).
mon_postgres_target: "10.0.4.10:9187"

# blackbox_exporter (task 1.23, decisions 120, 125), pinned like the others.
mon_blackbox_version: 0.29.1
mon_blackbox_archive: blackbox_exporter-{{ mon_blackbox_version }}.linux-amd64.tar.gz
mon_blackbox_sha256: b82b81839e6317e84fdd367f46d7ddd3b773fa09cbe2e3d5633a59171d741e76
mon_blackbox_listen: 127.0.0.1:9115

# What the probes check: proxy by address (decision 125), Unbound for DNS.
mon_proxy_ip: 10.0.2.10
mon_unbound_ip: 10.0.1.10

# The trust anchor for proxy's certificate. While Let's Encrypt is on
# staging (CLAUDE.md), that's the staging root "(STAGING) Pretend Pear X1",
# pinned by SHA-256 (expires 2035-06-04). After the switch to production,
# set mon_blackbox_ca_file to /etc/ssl/certs/ca-certificates.crt and the
# download is skipped.
mon_blackbox_ca_url: https://letsencrypt.org/certs/staging/letsencrypt-stg-root-x1.pem
mon_blackbox_ca_sha256: 3a5e1171e5f5c2d41522d438f225602e4236a68fb29c32399a95921a4ae80e73
mon_blackbox_ca_file: /etc/blackbox_exporter/le-staging-root-x1.pem

# YACE, CloudWatch's CPU credit balances (task 1.23, decision 121), pinned
# like the other exporters.
mon_yace_version: 0.68.0
mon_yace_archive: yet-another-cloudwatch-exporter-{{ mon_yace_version }}.linux-amd64.tar.gz
mon_yace_sha256: 2707d24680354bc4922074aaafc76fdeabeec3ba6538b3323d557c4c777d6433
mon_yace_listen: 127.0.0.1:5000
