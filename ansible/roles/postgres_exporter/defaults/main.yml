---
# postgres_exporter on db (task 1.23, decisions 120, 124), pinned like
# node_exporter: check the archive's SHA-256 against the release's
# sha256sums.txt on the laptop, then a PR.
postgres_exporter_version: 0.20.1
postgres_exporter_archive: postgres_exporter-{{ postgres_exporter_version }}.linux-amd64.tar.gz
postgres_exporter_sha256: 89d4f7e7920cad48fdc3133f789556ef5253c330a9f5fdace3bdb6344c0a8b5a

# db's private address only; mon is the only client.
postgres_exporter_listen: "{{ ansible_default_ipv4.address }}:9187"
