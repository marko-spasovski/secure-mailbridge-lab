# Managed by Ansible (common role). Decision 36.
# Ansible reaches sshd only through the SSM tunnel, which arrives on
# loopback, so sshd listens nowhere else. Port 22 is also closed in every
# security group and NACL, and on fw-ips by nftables; this makes a mistake
# there harmless.
# sshd keeps the first value it reads; this file sorts before
# 60-cloudimg-settings.conf, so these values win.
ListenAddress 127.0.0.1
ListenAddress ::1
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
