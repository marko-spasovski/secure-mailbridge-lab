---
# Existing sessions, including Ansible's own, run in child sshd processes
# and survive these restarts.
- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: Apply sshd listen change

- name: Restart ssh.socket
  ansible.builtin.systemd_service:
    name: ssh.socket
    state: restarted
  listen: Apply sshd listen change

- name: Restart ssh.service
  ansible.builtin.systemd_service:
    name: ssh.service
    state: restarted
  listen: Apply sshd listen change

- name: Load fw-ips kernel settings
  ansible.builtin.command: sysctl --load /etc/sysctl.d/99-fw-ips.conf
  changed_when: true

# The ruleset starts with "flush ruleset" and loads atomically, so a reload
# swaps the old rules for the new ones in one step.
- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

# A restart drops Unbound's cache; DNS is down for about a second.
- name: Restart Unbound
  ansible.builtin.systemd_service:
    name: unbound
    state: restarted

# A restart, not reload-rules, because reload-rules was refused once (cause
# still unknown). Forwarded traffic pauses while Suricata starts.
- name: Restart Suricata
  ansible.builtin.systemd_service:
    name: suricata
    state: restarted

- name: Restart OpenVPN
  ansible.builtin.systemd_service:
    name: openvpn-server@server
    state: restarted

- name: Refresh the package lists
  ansible.builtin.apt:
    update_cache: true
