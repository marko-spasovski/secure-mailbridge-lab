---
# Existing sessions, including Ansible's own, run in child sshd processes
# and survive these restarts.
- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: Apply sshd listen change

- name: Restart ssh.socket
  ansible.builtin.systemd_service:
    name: ssh.socket
    state: restarted
  listen: Apply sshd listen change

- name: Restart ssh.service
  ansible.builtin.systemd_service:
    name: ssh.service
    state: restarted
  listen: Apply sshd listen change
