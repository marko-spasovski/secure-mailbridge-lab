---
# Existing sessions, including Ansible's own, run in child sshd processes
# and survive these restarts.
- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: Apply sshd listen change

- name: Restart ssh.socket
  ansible.builtin.systemd_service:
    name: ssh.socket
    state: restarted
  listen: Apply sshd listen change

- name: Restart ssh.service
  ansible.builtin.systemd_service:
    name: ssh.service
    state: restarted
  listen: Apply sshd listen change

- name: Load fw-ips kernel settings
  ansible.builtin.command: sysctl --load /etc/sysctl.d/99-fw-ips.conf
  changed_when: true

# The ruleset starts with "flush ruleset" and loads atomically, so a reload
# swaps the old rules for the new ones in one step.
- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

# A restart drops Unbound's cache; DNS is down for about a second.
- name: Restart Unbound
  ansible.builtin.systemd_service:
    name: unbound
    state: restarted

# For config and unit changes. Forwarded traffic pauses while Suricata starts.
- name: Restart Suricata
  ansible.builtin.systemd_service:
    name: suricata
    state: restarted

# For rule changes (decision 44). Runs after a restart if both were notified,
# so it retries until the new process opens its socket. suricatasc exits 0
# even when the engine refuses, so success is read from the reply.
- name: Reload Suricata rules
  ansible.builtin.command: suricatasc -c reload-rules
  register: fw_ips_suricata_reload
  until: fw_ips_suricata_reload.stdout is search('"return":\s*"OK"')
  retries: 12
  delay: 10
  changed_when: true

- name: Restart OpenVPN
  ansible.builtin.systemd_service:
    name: openvpn-server@server
    state: restarted

- name: Refresh the package lists
  ansible.builtin.apt:
    update_cache: true
