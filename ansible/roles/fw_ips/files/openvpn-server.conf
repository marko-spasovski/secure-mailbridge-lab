# Managed by Ansible (fw_ips role). Tasks 1.7b, 1.8, 1.10; section 5.
# No secrets here: the key files are pulled from SSM by the role (decision 39).

# UDP 1194 is the only port open to the internet (sg-fw).
port 1194
proto udp4
dev tun0

# One /23 for both pools: users get 10.8.0.2-254 from the pool, and admins
# get a fixed 10.8.1.x from their ccd file (decision 23).
topology subnet
server 10.8.0.0 255.255.254.0 nopool
ifconfig-pool 10.8.0.2 10.8.0.254 255.255.254.0

# PKI from the offline CA. The CRL is re-read on every new connection.
ca ca.crt
cert fw-ips.crt
key fw-ips.key
tls-crypt tls-crypt.key
crl-verify crl.pem
# ECDHE only, so no DH parameters.
dh none
tls-version-min 1.3
data-ciphers AES-256-GCM
# Reject a server certificate used as a client one.
remote-cert-tls client

# Per-device settings; only the admin device has a file.
client-config-dir ccd

# Users reach the proxy subnet and Unbound only; nftables decides the rest.
push "route 10.0.2.0 255.255.255.0"
push "dhcp-option DNS 10.0.1.10"
push "route 10.0.1.10 255.255.255.255"

# Drop root after start-up; keep keys and tun0 across restarts as nobody.
user nobody
group nogroup
persist-key
persist-tun

# Ping every 10 s, restart a silent peer after 60 s (120 s on the client side).
keepalive 10 60
explicit-exit-notify 1
verb 3
