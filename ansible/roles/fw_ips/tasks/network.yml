---
# Kernel settings first: forwarding and send_redirects must already be in
# place when the nftables rules start forwarding traffic.
- name: Install the fw-ips kernel settings
  ansible.builtin.copy:
    src: 99-fw-ips.conf
    dest: /etc/sysctl.d/99-fw-ips.conf
    owner: root
    group: root
    mode: "0644"
  notify: Load fw-ips kernel settings

# Apply the settings now, not at the next boot, so nftables below runs on a
# host that already forwards.
- name: Load kernel settings before the firewall
  ansible.builtin.meta: flush_handlers

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

# Rules that are tested by hand first (decision 31) are installed here.
# validate catches syntax errors only; a valid but wrong rule still loads.
# backup keeps a timestamped copy of the previous file to restore by hand.
- name: Install the nftables ruleset
  ansible.builtin.copy:
    src: nftables.conf
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: /usr/sbin/nft -c -f %s
  notify: Reload nftables

# Enabled so the ruleset loads at boot. Started, so a host where it was
# stopped gets its rules now.
- name: Enable and start nftables
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
