---
# Kernel settings first: forwarding and send_redirects must already be in
# place when the nftables rules start forwarding traffic. The module compares
# the live kernel value on every run and sets it if it differs, so the
# setting can't be lost with a handler when a run stops (decision 103).
# Packets enter and leave on the same interface, so Linux would otherwise tell
# senders to bypass fw-ips; the kernel honours "all" OR the interface value,
# so all three send_redirects must be 0.
- name: Set the fw-ips kernel settings, live and in sysctl.d
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-fw-ips.conf
    sysctl_set: true
    state: present
    reload: false
  loop:
    - { name: net.ipv4.ip_forward, value: "1" }
    - { name: net.ipv4.conf.all.send_redirects, value: "0" }
    - { name: net.ipv4.conf.default.send_redirects, value: "0" }
    - { name: net.ipv4.conf.ens5.send_redirects, value: "0" }

# Run the common role's pending handlers (sshd's listen change) before the
# firewall is loaded, as before.
- name: Apply pending changes before the firewall
  ansible.builtin.meta: flush_handlers

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

# Rules that are tested by hand first (decision 31) are installed here.
# validate catches syntax errors only; a valid but wrong rule still loads.
# backup keeps a timestamped copy of the previous file to restore by hand.
- name: Install the nftables ruleset
  ansible.builtin.copy:
    src: nftables.conf
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: /usr/sbin/nft -c -f %s
  notify: Reload nftables

# Enabled so the ruleset loads at boot. Started, so a host where it was
# stopped gets its rules now.
- name: Enable and start nftables
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
