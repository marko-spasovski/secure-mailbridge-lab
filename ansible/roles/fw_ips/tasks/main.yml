---
- name: Set up apt and security updates
  ansible.builtin.import_tasks: base.yml

- name: Harden sshd
  ansible.builtin.import_tasks: sshd.yml

- name: Configure forwarding and the firewall
  ansible.builtin.import_tasks: network.yml

- name: Configure DNS for VPN clients and private subnets
  ansible.builtin.import_tasks: dns.yml

- name: Run Suricata inline
  ansible.builtin.import_tasks: suricata.yml

- name: Run the OpenVPN server
  ansible.builtin.import_tasks: openvpn.yml
