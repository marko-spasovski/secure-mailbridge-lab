---
- name: Restart Docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted

# Runs pull, migrate and grants again before the app, so a new image or
# grant file is applied in the right order.
- name: Restart Mailbridge
  ansible.builtin.systemd_service:
    name: mailbridge
    state: restarted
    daemon_reload: true
