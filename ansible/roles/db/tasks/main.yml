---
# PostgreSQL for Mailbridge, task 1.13 (decisions 47 to 52). Runs after the
# common role, which provides apt over HTTPS and the AWS CLI.

# psycopg2 is what the community.postgresql modules use on the host.
- name: Install PostgreSQL
  ansible.builtin.apt:
    name:
      - postgresql
      - python3-psycopg2
    state: present

# listen_addresses is read only at start, so this one needs a restart.
- name: Install the PostgreSQL settings
  ansible.builtin.copy:
    src: mailbridge.conf
    dest: "/etc/postgresql/{{ db_pg_version }}/main/conf.d/mailbridge.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: Restart PostgreSQL

# The whole file, so it can be reviewed line by line and drift shows up.
- name: Install the client authentication rules
  ansible.builtin.copy:
    src: pg_hba.conf
    dest: "/etc/postgresql/{{ db_pg_version }}/main/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Reload PostgreSQL

- name: Enable and start PostgreSQL
  ansible.builtin.systemd_service:
    name: "postgresql@{{ db_pg_version }}-main"
    enabled: true
    state: started

# Apply the settings and rules now, before the role and helper use them.
- name: Apply PostgreSQL changes
  ansible.builtin.meta: flush_handlers

# No password here: it never becomes an Ansible variable (decision 52).
# The role can log in and own its database, and nothing more.
- name: Create the mailbridge role
  community.postgresql.postgresql_user:
    name: mailbridge
    role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOREPLICATION
  become: true
  become_user: postgres

- name: Create the mailbridge database
  community.postgresql.postgresql_db:
    name: mailbridge
    owner: mailbridge
  become: true
  become_user: postgres

# The app's runtime role (decision 54, the app's ADR 0008): row access only,
# granted by the app host after each migration. Owns nothing.
- name: Create the mailbridge_app role
  community.postgresql.postgresql_user:
    name: mailbridge_app
    role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOREPLICATION,NOBYPASSRLS
  become: true
  become_user: postgres

# postgres_exporter's role (decision 124): statistics only, through the
# built-in pg_monitor; it can't read any table. No password: it logs in by
# peer authentication on the socket (pg_hba.conf).
- name: Create the postgres_exporter role
  community.postgresql.postgresql_user:
    name: postgres_exporter
    role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOREPLICATION
  become: true
  become_user: postgres

- name: Give postgres_exporter the pg_monitor role
  community.postgresql.postgresql_membership:
    groups: [pg_monitor]
    target_roles: [postgres_exporter]
    state: present
  become: true
  become_user: postgres

# Installed even in check mode, so the task below can compare.
- name: Install the password helper
  ansible.builtin.copy:
    src: set-db-password
    dest: /usr/local/sbin/set-db-password
    owner: root
    group: root
    mode: "0755"
  check_mode: false

# db pulls each password with its own role and sets it on the host; Ansible
# sees only "changed" or "unchanged" (decisions 47, 52, 54). check_mode
# false: the helper's "check" argument makes it read-only.
- name: Set the role passwords from SSM
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/set-db-password
      - "{{ item.role }}"
      - "{{ item.param }}"
      - "{{ 'check' if ansible_check_mode else '' }}"
  loop:
    - { role: mailbridge, param: /mailbridge/db-password }
    - { role: mailbridge_app, param: /mailbridge/db-app-password }
  loop_control:
    label: "{{ item.role }}"
  register: db_password_set
  changed_when: db_password_set.stdout == "changed"
  check_mode: false
