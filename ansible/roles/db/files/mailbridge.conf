# Managed by Ansible (db role). Task 1.13.
# Ubuntu's postgresql.conf reads conf.d/ last, so these values win.

# Loopback for the password helper's test login, and 10.0.4.10 for app.
# Nothing else: sg-db, the data NACL and pg_hba.conf each limit it further.
listen_addresses = 'localhost,10.0.4.10'

# PostgreSQL 16's default, written down so a change shows up as drift.
password_encryption = scram-sha-256

# Connection attempts, with source address and user, for Wazuh (1.17).
log_connections = on
