# Managed by Ansible (db role). Tasks 1.13, 1.14 and 1.23, decisions 48, 54 and 124.
# The role owns the whole file. First match wins; anything not listed is
# refused, so the only network logins are the two app roles to their own
# database: the owner for migrations and grants, mailbridge_app for the app.
#
# TYPE  DATABASE    USER        ADDRESS         METHOD

# Administration on the host itself, as the postgres OS user only.
local   all         postgres                    peer

# postgres_exporter (decision 124): the OS user of the same name, through
# the socket, to the maintenance database only. Peer: the kernel tells
# PostgreSQL who is connecting, so there's no password to keep.
local   postgres    postgres_exporter           peer

# The password helper's test logins (decision 52).
host    mailbridge  mailbridge,mailbridge_app  127.0.0.1/32  scram-sha-256

# app, the only host allowed in (ARCHITECTURE.md section 4).
host    mailbridge  mailbridge,mailbridge_app  10.0.3.10/32   scram-sha-256
