# Managed by Ansible (db role). Task 1.13, decision 48.
# The role owns the whole file. First match wins; anything not listed is
# refused, so the only network login is mailbridge to its own database.
#
# TYPE  DATABASE    USER        ADDRESS         METHOD

# Administration on the host itself, as the postgres OS user only.
local   all         postgres                    peer

# The password helper's test login (decision 52), and later postgres_exporter.
host    mailbridge  mailbridge  127.0.0.1/32    scram-sha-256

# app, the only host allowed in (ARCHITECTURE.md section 4).
host    mailbridge  mailbridge  10.0.3.10/32    scram-sha-256
