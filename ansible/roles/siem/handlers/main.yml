---
- name: Refresh the package lists
  ansible.builtin.apt:
    update_cache: true

- name: Restart the Wazuh indexer
  ansible.builtin.systemd_service:
    name: wazuh-indexer
    state: restarted
    daemon_reload: true

- name: Restart the Wazuh manager
  ansible.builtin.systemd_service:
    name: wazuh-manager
    state: restarted

- name: Restart Filebeat
  ansible.builtin.systemd_service:
    name: filebeat
    state: restarted
