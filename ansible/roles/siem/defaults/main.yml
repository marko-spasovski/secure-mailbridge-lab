---
# siem: Wazuh all-in-one (task 1.16, decisions 85 to 90).
siem_private_ip: 10.0.5.10

# Wazuh, pinned (decision 85). Every Wazuh package is installed at this
# version and held; a bump is a reviewed PR.
siem_wazuh_version: 4.14.9-1

# Wazuh's apt signing key, pinned by the SHA-256 of the armored file, so a
# changed key fails the run instead of being trusted (decision 86). Its
# fingerprint is 0DCF CA55 47B1 9D2A 6099 5060 96B3 EE5F 2911 1145 and it
# expires 2027-05-15. To update: download it on the laptop, check
#   gpg --show-keys --with-fingerprint GPG-KEY-WAZUH
# still shows that fingerprint, and only then copy its SHA-256 here, in a PR.
siem_wazuh_gpg_sha256: a378ca8dfa6b72122df288f64a0cde54f1cbfa3db9b43e6865cb73def35b5b17

# Indexer heap, Xms = Xmx (decisions 87, 99). 3 GB of the t3.large's 8 GB:
# OpenSearch wants at most half, and Lucene uses the rest as page cache.
siem_indexer_heap: 3g

# The persistent data volume (decision 88), found by its Name tag from the
# laptop, and mounted where the package keeps its data.
siem_data_volume_name: mailbridge-lab-wazuh-data
siem_data_label: wazuh-data
siem_indexer_data_dir: /var/lib/wazuh-indexer

# The indexer's certificates (decision 90): SSM name under /siem/certs/ and
# the file name the package's opensearch.yml expects.
siem_indexer_certs:
  - { param: root-ca-cert, file: root-ca.pem }
  - { param: indexer-cert, file: indexer.pem }
  - { param: indexer-key, file: indexer-key.pem }
  - { param: admin-cert, file: admin.pem }
  - { param: admin-key, file: admin-key.pem }

# Filebeat OSS from Wazuh's repository: the build Wazuh 4.x ships, newest
# rebuild of 7.10.2 (decision 85).
siem_filebeat_version: 7.10.2-2

# Filebeat's index template and Wazuh module, pinned by SHA-256 like lego
# (decision 86). The template comes from the release tag that matches the
# manager; to update, download both on the laptop and copy the hashes here.
siem_wazuh_template_url: https://raw.githubusercontent.com/wazuh/wazuh/v4.14.9/extensions/elasticsearch/7.x/wazuh-template.json
siem_wazuh_template_sha256: b2d182f49cc68957849e77fd2d79528fd2273ebaec1106c9661c9e320577a089
siem_filebeat_module_url: https://packages.wazuh.com/4.x/filebeat/wazuh-filebeat-0.5.tar.gz
siem_filebeat_module_sha256: 7a8c67c47b22f89ab271b7e35f108f18b2215b7aa411cdd23c9994393070d38d

# Filebeat's certificates: the server (wazuh-1) pair, under the names its
# filebeat.yml and the manager's <indexer> block expect (decision 90).
siem_filebeat_certs:
  - { param: root-ca-cert, file: root-ca.pem }
  - { param: server-cert, file: filebeat.pem }
  - { param: server-key, file: filebeat-key.pem }

# The dashboard's certificates (decision 90), named as its settings expect.
siem_dashboard_certs:
  - { param: root-ca-cert, file: root-ca.pem }
  - { param: dashboard-cert, file: dashboard.pem }
  - { param: dashboard-key, file: dashboard-key.pem }
