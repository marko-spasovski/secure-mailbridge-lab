---
# siem: Wazuh all-in-one (task 1.16, decisions 85 to 90).
siem_private_ip: 10.0.5.10

# Wazuh, pinned (decision 85). Every Wazuh package is installed at this
# version and held; a bump is a reviewed PR.
siem_wazuh_version: 4.14.9-1

# Wazuh's apt signing key, pinned by the SHA-256 of the armored file, so a
# changed key fails the run instead of being trusted (decision 86). Its
# fingerprint is 0DCF CA55 47B1 9D2A 6099 5060 96B3 EE5F 2911 1145 and it
# expires 2027-05-15. To update: download it on the laptop, check
#   gpg --show-keys --with-fingerprint GPG-KEY-WAZUH
# still shows that fingerprint, and only then copy its SHA-256 here, in a PR.
siem_wazuh_gpg_sha256: a378ca8dfa6b72122df288f64a0cde54f1cbfa3db9b43e6865cb73def35b5b17

# Indexer heap, Xms = Xmx (decision 87). 1.5 GB of the t3.medium's 4 GB.
siem_indexer_heap: 1536m

# The persistent data volume (decision 88), found by its Name tag from the
# laptop, and mounted where the package keeps its data.
siem_data_volume_name: mailbridge-lab-wazuh-data
siem_data_label: wazuh-data
siem_indexer_data_dir: /var/lib/wazuh-indexer

# The indexer's certificates (decision 90): SSM name under /siem/certs/ and
# the file name the package's opensearch.yml expects.
siem_indexer_certs:
  - { param: root-ca-cert, file: root-ca.pem }
  - { param: indexer-cert, file: indexer.pem }
  - { param: indexer-key, file: indexer-key.pem }
  - { param: admin-cert, file: admin.pem }
  - { param: admin-key, file: admin-key.pem }
