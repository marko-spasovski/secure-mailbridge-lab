---
# Wazuh all-in-one on siem (task 1.16, decisions 85 to 90). Runs after the
# common role, which provides apt over HTTPS, the AWS CLI and fetch-ssm-param.
# Order: the data volume, the indexer, then the manager and Filebeat that
# write to it; the dashboard follows in its own task file.
- name: Mount the data volume
  ansible.builtin.import_tasks: volume.yml

- name: Add the Wazuh repository
  ansible.builtin.import_tasks: repo.yml

- name: Install and configure the indexer
  ansible.builtin.import_tasks: indexer.yml

- name: Install and configure the manager and Filebeat
  ansible.builtin.import_tasks: manager.yml
