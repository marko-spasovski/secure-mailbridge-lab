---
# The Wazuh manager and Filebeat, which ships its alerts to the indexer
# (task 1.16).
- name: Install the manager and Filebeat at the pinned versions
  ansible.builtin.apt:
    name:
      - wazuh-manager={{ siem_wazuh_version }}
      - filebeat={{ siem_filebeat_version }}
    state: present

- name: Hold the manager and Filebeat packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - wazuh-manager
    - filebeat

- name: Install the manager settings
  ansible.builtin.template:
    src: ossec.conf.j2
    dest: /var/ossec/etc/ossec.conf
    owner: root
    group: wazuh
    mode: "0660"
  notify: Restart the Wazuh manager

- name: Install the API settings
  ansible.builtin.template:
    src: api.yaml.j2
    dest: /var/ossec/api/configuration/api.yaml
    owner: root
    group: wazuh
    mode: "0660"
  notify: Restart the Wazuh manager

- name: Install the Filebeat settings
  ansible.builtin.template:
    src: filebeat.yml.j2
    dest: /etc/filebeat/filebeat.yml
    owner: root
    group: root
    mode: "0600"
  notify: Restart Filebeat

- name: Install Wazuh's index template for Filebeat
  ansible.builtin.get_url:
    url: "{{ siem_wazuh_template_url }}"
    dest: /etc/filebeat/wazuh-template.json
    checksum: sha256:{{ siem_wazuh_template_sha256 }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart Filebeat

- name: Download Wazuh's Filebeat module
  ansible.builtin.get_url:
    url: "{{ siem_filebeat_module_url }}"
    dest: /var/cache/wazuh-filebeat-module.tar.gz
    checksum: sha256:{{ siem_filebeat_module_sha256 }}
    owner: root
    group: root
    mode: "0644"

# unarchive compares the archive with what is on disk (tar --diff), so it
# changes only when the pinned archive does.
- name: Unpack Wazuh's Filebeat module
  ansible.builtin.unarchive:
    src: /var/cache/wazuh-filebeat-module.tar.gz
    dest: /usr/share/filebeat/module
    remote_src: true
    owner: root
    group: root
  notify: Restart Filebeat

- name: Create Filebeat's certificate directory
  ansible.builtin.file:
    path: /etc/filebeat/certs
    state: directory
    owner: root
    group: root
    mode: "0500"

# The manager's indexer connector reads the same files (its <indexer> block).
- name: Pull Filebeat's certificates from SSM
  ansible.builtin.command: >-
    /usr/local/sbin/fetch-ssm-param /siem/certs/{{ item.param }}
    /etc/filebeat/certs/{{ item.file }} 0400
    {{ 'check' if ansible_check_mode else '' }}
  loop: "{{ siem_filebeat_certs }}"
  loop_control:
    label: "{{ item.file }}"
  register: siem_filebeat_cert_pull
  changed_when: siem_filebeat_cert_pull.stdout == 'changed'
  check_mode: false
  notify:
    - Restart Filebeat
    - Restart the Wazuh manager

# Handlers first: on a fresh host the manager's restart is its first start,
# so it never starts and then restarts while its API is still binding 55000.
- name: Apply manager settings
  ansible.builtin.meta: flush_handlers

- name: Enable and start the manager
  ansible.builtin.systemd_service:
    name: wazuh-manager
    enabled: true
    state: started

# The port opens before the API answers, so the helper below retries.
- name: Wait for the Wazuh API port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 55000
    timeout: 600

- name: Install the manager credentials helper
  ansible.builtin.copy:
    src: set-manager-credentials
    dest: /usr/local/sbin/set-manager-credentials
    owner: root
    group: root
    mode: "0755"
  check_mode: false

# Ansible sees only "changed" or "unchanged" (decision 95). The manager's
# indexer connector reads its keystore at start, hence the restarts.
- name: Set Filebeat, keystore and API credentials
  ansible.builtin.command: >-
    /usr/local/sbin/set-manager-credentials {{ 'check' if ansible_check_mode else '' }}
  register: siem_manager_credentials
  changed_when: siem_manager_credentials.stdout == 'changed'
  until: siem_manager_credentials.rc == 0
  retries: 10
  delay: 15
  check_mode: false
  notify:
    - Restart the Wazuh manager
    - Restart Filebeat

# Only now: Filebeat exits at start if its keystore has no credentials.
- name: Enable and start Filebeat
  ansible.builtin.systemd_service:
    name: filebeat
    enabled: true
    state: started
