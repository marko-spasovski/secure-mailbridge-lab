---
# node_exporter from the pinned release tarball, run by our own unit
# (task 1.23, decision 120), the same pattern as Prometheus on mon.

# Reads /proc and /sys only, so it runs as its own user with no privileges.
- name: Create the node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

- name: Create the node_exporter download and install directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /var/cache/node_exporter
    - /opt/node_exporter/{{ node_exporter_version }}

# get_url refuses the file if the SHA-256 differs from the pinned value, and
# skips the download when a file with that hash is already there.
- name: Download the pinned node_exporter release
  ansible.builtin.get_url:
    timeout: 60
    url: https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{ node_exporter_archive }}
    dest: /var/cache/node_exporter/{{ node_exporter_archive }}
    checksum: sha256:{{ node_exporter_sha256 }}
    owner: root
    group: root
    mode: "0644"
  register: node_exporter_download
  until: node_exporter_download is succeeded
  retries: 3
  delay: 10

- name: Unpack node_exporter
  ansible.builtin.unarchive:
    src: /var/cache/node_exporter/{{ node_exporter_archive }}
    dest: /opt/node_exporter/{{ node_exporter_version }}
    remote_src: true
    extra_opts: [--strip-components=1]
    include:
      - node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter
    owner: root
    group: root
    creates: /opt/node_exporter/{{ node_exporter_version }}/node_exporter

- name: Link the pinned node_exporter into the PATH
  ansible.builtin.file:
    src: /opt/node_exporter/{{ node_exporter_version }}/node_exporter
    dest: /usr/local/bin/node_exporter
    state: link
  notify: Restart node_exporter

- name: Install the node_exporter unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
