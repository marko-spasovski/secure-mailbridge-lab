---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# A config that doesn't parse fails here and the running Nginx keeps its old
# config, instead of the reload taking the site down.
- name: Reload Nginx
  ansible.builtin.command: nginx -t -q
  changed_when: true
  notify: Apply the Nginx reload

- name: Apply the Nginx reload
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
