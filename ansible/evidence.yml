---
# Raw evidence before teardown (decision 107): run after the last attack of
# a session and before `hosts_enabled=false`. Wazuh's alerts survive on their
# own volume (decision 88); this keeps the raw lines, including the ones no
# rule matched, which a miss in the findings report needs.
# Usage, from ansible/: ansible-playbook evidence.yml
# Output: ~/mailbridge-evidence/<UTC time>/<host>.tar.gz and SHA256SUMS,
# outside the repo. Mailbridge's audit log holds request headers, so the
# folder is 0700 and never copied into the repo.
- name: Pack and fetch each host's raw logs
  hosts: fw_ips:proxy:db:app
  become: true
  gather_facts: false
  vars:
    evidence_root: "{{ lookup('ansible.builtin.env', 'HOME') }}/mailbridge-evidence"
  tasks:
    - name: Choose one folder name for this export
      ansible.builtin.set_fact:
        evidence_dir: "{{ evidence_root }}/{{ now(utc=true).strftime('%Y-%m-%dT%H%MZ') }}"
      run_once: true

    - name: Create the folder on the laptop
      ansible.builtin.file:
        path: "{{ evidence_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Pack this host's logs
      ansible.builtin.script: files/collect-evidence
      register: evidence_archive
      changed_when: true

    - name: Fetch the archive
      ansible.builtin.fetch:
        src: "{{ evidence_archive.stdout_lines[-1] }}"
        dest: "{{ evidence_dir }}/{{ inventory_hostname | regex_replace('^mailbridge-lab-', '') }}.tar.gz"
        flat: true

    - name: Remove the archive from the host
      ansible.builtin.file:
        path: "{{ evidence_archive.stdout_lines[-1] }}"
        state: absent

- name: Record checksums
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Write SHA256SUMS next to the archives
      ansible.builtin.shell: sha256sum -- *.tar.gz > SHA256SUMS && chmod 0600 -- *.tar.gz SHA256SUMS
      args:
        chdir: "{{ hostvars[groups['fw_ips'][0]]['evidence_dir'] }}"
      changed_when: true
