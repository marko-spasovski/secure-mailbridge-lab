# Run Ansible from this directory (ansible/) so this file is picked up.
[defaults]
inventory = inventories/aws/aws_ec2.yml
roles_path = roles
# Show task results as readable YAML instead of one-line JSON.
callback_result_format = yaml
# Seconds to wait for the SSH connection and for sudo's reply (decision 102).
# The default 12 s fails on a phone hotspot, where the SSM channel stalls
# for longer while sudo itself takes milliseconds on the host.
timeout = 60

[ssh_connection]
# Pipelining sends modules over the open SSH channel instead of copying
# a temp file first: fewer round trips through the SSM tunnel.
pipelining = True
# One SSM session per host, reused by every task for 60 s after the last one.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
